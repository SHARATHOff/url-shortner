<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      width: 90%;
      max-width: 420px;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      color: #1e293b;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="url"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      outline: none;
      transition: 0.3s ease;
    }

    input[type="url"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
    }

    button {
      padding: 12px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    #shortened-url {
      margin-top: 1.5rem;
      background-color: #f1f5f9;
      padding: 1rem;
      border-radius: 10px;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    #shortened-url p {
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    #shortened-url a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    #shortened-url a:hover {
      text-decoration: underline;
    }

    .copy-btn {
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s ease;
    }

    .copy-btn:hover {
      background-color: #059669;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #10b981;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .toast.show {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔗 URL Shortener</h1>

    <form method="post">
      <input type="url" name="long_url" placeholder="Enter your URL here..." required />
      <button type="submit">Shorten URL</button>
    </form>

    {% if shortened_url %}
      <div id="shortened-url" style="display:block;">
        <p>Shortened URL:</p>
        <a id="shortened-url-link" href="{{ shortened_url }}" target="_blank">{{ shortened_url }}</a>
        <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
      </div>
    {% endif %}
  </div>

  <div class="toast" id="toast">Copied to clipboard ✅</div>

  <script>
    function copyToClipboard() {
      const link = document.getElementById("shortened-url-link").textContent;
      navigator.clipboard.writeText(link);
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }
  </script>
</body>
</html>
